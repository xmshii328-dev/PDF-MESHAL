<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منشئ ملفات PDF الذكي</title>
    <!-- مكتبة Tailwind CSS للتصميم -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- مكتبة html2pdf لتوليد ملفات الـ PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-p-4 flex items-center justify-center min-h-screen">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden my-6 border border-gray-100">
        <!-- الهيدر -->
        <div class="bg-[#6D7B8D] text-white p-6 text-center">
            <h1 class="text-2xl font-bold">منشئ ملفات PDF الذكي</h1>
            <p class="text-xs text-gray-100 mt-1">أدخل نصوصك وأرفق صورك ثم حولها كملف PDF بضغطة زر</p>
        </div>

        <!-- النموذج -->
        <div class="p-6 space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">عنوان المستند (اختياري)</label>
                <input type="text" id="docTitle" placeholder="مثال: تقرير العمل / قرار إداري" 
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#6D7B8D] focus:outline-none text-sm">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">محتوى النص</label>
                <textarea id="docContent" rows="4" placeholder="اكتب التفاصيل أو نص القرار هنا..." 
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#6D7B8D] focus:outline-none text-sm"></textarea>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">إرفق صور (حتى 5 صور)</label>
                <label class="flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-xl p-4 cursor-pointer hover:bg-gray-50 transition">
                    <svg class="w-8 h-8 text-[#6D7B8D] mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <span class="text-xs text-gray-600 font-medium">اضغط لاختيار صور من جهازك</span>
                    <input type="file" id="imageInput" accept="image/*" multiple class="hidden" onchange="handleImages(event)">
                </label>
            </div>

            <!-- معاينة الصور المضافة مع زر الحذف -->
            <div id="imagesPreviewContainer" class="space-y-3"></div>

            <button onclick="generatePDF()" class="w-full bg-[#6D7B8D] hover:bg-[#576371] text-white font-bold py-3 rounded-xl transition shadow-lg text-sm flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                تحميل الملف (PDF)
            </button>
        </div>
    </div>

    <!-- قالب الـ PDF المخفي للتصدير -->
    <div id="pdfContent" class="hidden bg-white p-8 max-w-2xl mx-auto text-right">
        <h2 id="pdfTitleDisplay" class="text-2xl font-bold text-[#6D7B8D] mb-4"></h2>
        <p id="pdfTextDisplay" class="text-gray-800 text-base leading-relaxed whitespace-pre-wrap mb-6"></p>
        <div id="pdfImagesDisplay" class="space-y-4"></div>
    </div>

    <script>
        let selectedImages = [];

        function handleImages(event) {
            const files = Array.from(event.target.files);
            if (selectedImages.length + files.length > 5) {
                alert("عذراً، الحد الأقصى هو 5 صور فقط.");
                return;
            }

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedImages.push(e.target.result);
                    renderPreviews();
                }
                reader.readAsDataURL(file);
            });
        }

        function removeImage(index) {
            selectedImages.splice(index, 1);
            renderPreviews();
        }

        function renderPreviews() {
            const container = document.getElementById('imagesPreviewContainer');
            container.innerHTML = '';
            if (selectedImages.length > 0) {
                const label = document.createElement('p');
                label.className = "text-xs font-semibold text-gray-500";
                label.innerText = "الصور المختارة (" + selectedImages.length + "/5):";
                container.appendChild(label);
            }

            selectedImages.forEach((src, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = "flex items-center justify-between bg-gray-50 p-2 rounded-xl border border-gray-200";

                const img = document.createElement('img');
                img.src = src;
                img.className = "w-16 h-16 object-cover rounded-lg";

                const deleteBtn = document.createElement('button');
                deleteBtn.innerHTML = `
                    <svg class="w-5 h-5 text-red-500 hover:text-red-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                    </svg>
                `;
                deleteBtn.className = "p-2 bg-white rounded-lg shadow-sm border border-gray-100 hover:bg-red-50 transition";
                deleteBtn.onclick = () => removeImage(index);

                wrapper.appendChild(img);
                wrapper.appendChild(deleteBtn);
                container.appendChild(wrapper);
            });
        }

        function generatePDF() {
            const title = document.getElementById('docTitle').value;
            const content = document.getElementById('docContent').value;

            if (!title && !content && selectedImages.length === 0) {
                alert("الرجاء إدخال عنوان، نص، أو اختيار صورة واحدة على الأقل قبل التحميل.");
                return;
            }

            document.getElementById('pdfTitleDisplay').innerText = title;
            document.getElementById('pdfTextDisplay').innerText = content;

            const imagesContainer = document.getElementById('pdfImagesDisplay');
            imagesContainer.innerHTML = '';
            selectedImages.forEach(src => {
                const img = document.createElement('img');
                img.src = src;
                // عرض الصورة بأبعادها الطبيعية وغير مقيدة
                img.className = "max-w-full h-auto rounded-lg mx-auto block mb-4";
                imagesContainer.appendChild(img);
            });

            const element = document.getElementById('pdfContent');
            element.classList.remove('hidden');

            const opt = {
                margin:       10,
                filename:     (title ? title.trim() : 'document') + '.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().from(element).set(opt).save().then(() => {
                element.classList.add('hidden');
            });
        }
    </script>
</body>
</html>
