<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منشئ ملفات PDF الاحترافي</title>
    <!-- تضمين مكتبات html2pdf و Tailwind CSS للتصميم الاحترافي -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 flex items-center justify-center">

    <div class="max-w-2xl w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <!-- الهيدر -->
        <div class="bg-indigo-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">منشئ ملفات PDF الذكي</h1>
            <p class="text-indigo-100 text-sm mt-1">أدخل نصوصك وأرفق صورك ثم حمّلها كملف PDF بضغطة زر</p>
        </div>

        <!-- محتوى نموذج الإدخال -->
        <div class="p-6 space-y-6">
            
            <!-- عنوان المستند -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">عنوان المستند (اختياري)</label>
                <input type="text" id="docTitle" placeholder="مثال: تقرير العمل / قرار إداري" 
                       class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
            </div>

            <!-- النص -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">محتوى النص</label>
                <textarea id="docContent" rows="4" placeholder="اكتب التفاصيل أو نص القرار هنا..." 
                          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition"></textarea>
            </div>

            <!-- رفع الصورة -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">إرفاق صورة</label>
                <div class="flex items-center justify-center w-full">
                    <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-indigo-300 border-dashed rounded-lg cursor-pointer bg-indigo-50 hover:bg-indigo-100 transition">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                            <svg class="w-8 h-8 mb-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            <p class="text-sm text-indigo-600 font-semibold">اضغط لاختيار صورة من جهازك</p>
                        </div>
                        <input type="file" id="imageInput" accept="image/*" class="hidden" />
                    </label>
                </div>
            </div>

            <!-- معاينة الصورة المرفقة -->
            <div id="imagePreviewContainer" class="hidden">
                <p class="text-xs font-semibold text-gray-500 mb-2">الصورة المختارة:</p>
                <img id="imagePreview" src="" class="max-h-48 rounded-lg border border-gray-200 mx-auto object-cover">
            </div>

            <!-- زر التصدير -->
            <button onclick="exportToPDF()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg hover:shadow-xl transition duration-200 flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                تحميل الملف (PDF)
            </button>

        </div>
    </div>

    <!-- القالب المبتكر المخفي الذي يتم تحويله لـ PDF -->
    <div class="hidden">
        <div id="pdfTemplate" class="p-10 bg-white text-gray-800 dir-rtl" style="font-family: 'Cairo', sans-serif;">
            <div id="pdfTitleContainer" class="border-b-2 border-indigo-600 pb-4 mb-6">
                <h1 id="pdfTitle" class="text-3xl font-bold text-indigo-900"></h1>
                <p class="text-xs text-gray-400 mt-2">تم إنشاؤه عبر منظومة إدارة العمل الذكية</p>
            </div>
            
            <div id="pdfText" class="text-lg leading-relaxed whitespace-pre-wrap mb-6 text-gray-700"></div>

            <div id="pdfImageContainer" class="mt-6 text-center">
                <img id="pdfImage" src="" class="max-w-full rounded-lg shadow-sm border border-gray-200 mx-auto" style="max-height: 500px;">
            </div>
        </div>
    </div>

    <script>
        let uploadedImageBase64 = '';

        // معاينة الصورة عند رفعها
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedImageBase64 = event.target.result;
                    document.getElementById('imagePreview').src = uploadedImageBase64;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        // دالة إنشاء وتحميل ملف الـ PDF
        function exportToPDF() {
            const title = document.getElementById('docTitle').value;
            const content = document.getElementById('docContent').value;

            if (!title && !content && !uploadedImageBase64) {
                alert('يرجى إضافة نص أو اختيار صورة أولاً!');
                return;
            }

            // تجهيز البيانات داخل قالب الـ PDF
            document.getElementById('pdfTitle').innerText = title || 'مستند إلكتروني';
            document.getElementById('pdfText').innerText = content;
            
            const imgElement = document.getElementById('pdfImage');
            if (uploadedImageBase64) {
                imgElement.src = uploadedImageBase64;
                imgElement.parentElement.style.display = 'block';
            } else {
                imgElement.parentElement.style.display = 'none';
            }

            const element = document.getElementById('pdfTemplate');

            // إعدادات التصدير للحصول على أعلى جودة ودعم للغة العربية
            const opt = {
                margin:       10,
                filename:     (title || 'document') + '.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            // تشغيل دالة التصدير
            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
